<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="index.css">
  
  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

<div class="outer-container">

  <div class="inner-contOne">

      <h2>Your Result</h2>
    
       <div class="cont-two-circle">
        <h3>76</h3>
        <p>of 100</p>
       </div>

      <div class="cont-two-btm-text">
        <h4>Great</h4>
        <p>You scored higher than 65% of the people who have taken these tests.</p>
      </div>




  </div>

    <div class="inner-contTwo">
      <h2>Summary</h2>

      

      <div class="inner-cont-box reaction-box">
        <div class="box-left">
          <img src="./assets/images/icon-reaction.svg" alt="reaction icon">
          <p>Reaction</p>
        </div>
        <p class="box-score"><b>80</b> / 100</p>
      </div>

      <div class="inner-cont-box memory-box">
        <div class="box-left">
          <img src="./assets/images/icon-memory.svg" alt="memory icon">
          <p>Memory</p>
        </div>
        <p class="box-score"><b>92</b> / 100</p>
      </div>

      <div class="inner-cont-box verbal-box">
        <div class="box-left">
          <img src="./assets/images/icon-verbal.svg" alt="verbal icon">
          <p>Verbal</p>
        </div>
        <p class="box-score"><b>61</b> / 100</p>
      </div>

      <div class="inner-cont-box visual-box">
        <div class="box-left">
          <img src="./assets/images/icon-visual.svg" alt="visual icon">
          <p>Visual</p>
        </div>
        <p class="box-score"><b>73</b> / 100</p>
      </div>

      <button>Continue</button>


    </div>

</div>







</body>
</html>
